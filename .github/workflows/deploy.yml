name: Deploy backend to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly until the VM secrets exist, so pushes made before the
    # host is provisioned do not produce failed runs.
    if: ${{ secrets.DEPLOY_VM_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/brokenrepo-backend
            git pull origin main
            cd server
            npm ci --omit=dev
            pm2 restart brokenrepo-api || pm2 start ecosystem.config.cjs --env production
            echo "Deployment complete at $(date)"
