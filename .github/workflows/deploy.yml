name: Deploy backend to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No secrets-based job guard: the `secrets` context is not available in
    # job-level `if` expressions, and referencing it there errored every run
    # out before a job was created (zero jobs, red run). The VM is provisioned
    # now, so every push to main should deploy — if the secrets ever go
    # missing, the ssh step fails loudly instead of skipping silently.
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/brokenrepo-backend
            git pull origin main
            cd server
            npm ci --omit=dev
            pm2 restart brokenrepo-api || pm2 start ecosystem.config.cjs --env production
            echo "Deployment complete at $(date)"
