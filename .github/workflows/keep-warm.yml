# Pings the Render free-tier backend every 5 minutes so its service stays warm
# and admin pages don't hit 30-60s cold starts. Free for public repos.
name: Keep backend warm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS --max-time 30 https://codebreak-api.onrender.com/health
